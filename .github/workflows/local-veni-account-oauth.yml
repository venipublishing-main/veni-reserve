name: Local Veni Account OAuth client contract

on:
  pull_request:
    paths:
      - "app/lib/veni-oauth-*.server.ts"
      - "app/routes/veni-oauth-*"
      - "app/routes.ts"
      - "local/veni-oauth-start.mjs"
      - "tests/veni-oauth-client.test.mjs"
      - "docs/architecture/veni-account-oauth-client-local.md"
      - ".github/workflows/local-veni-account-oauth.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mock-protocol-and-session-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: node --experimental-strip-types --test tests/veni-oauth-client.test.mjs
