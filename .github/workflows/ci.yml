name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - name: Pinned shared-account M2 compatibility preview (offline only)
        run: pnpm test:shared-preview
      - run: pnpm build
      - name: Built standalone route boundary
        timeout-minutes: 2
        run: |
          setsid pnpm exec vite preview --host 127.0.0.1 --port 5185 --strictPort > /tmp/reserve-site.log 2>&1 &
          site_pid=$!
          trap 'kill -- "-$site_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5185/health > /dev/null; then break; fi
            sleep 1
          done
          node scripts/site-smoke.mjs http://127.0.0.1:5185
      - run: pnpm build:ssr-preview
      - name: Isolated SSR preview HTTP and artifact boundary
        timeout-minutes: 2
        run: |
          node ssr-preview/verify.mjs --for-publication
          setsid pnpm exec wrangler dev --config build/server/wrangler.json --ip 127.0.0.1 --port 5186 --local > /tmp/ssr-preview.log 2>&1 &
          ssr_pid=$!
          trap 'kill -- "-$ssr_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5186/health > /dev/null; then break; fi
            sleep 1
          done
          node ssr-preview/smoke.mjs http://127.0.0.1:5186
      - run: pnpm build:playground-preview
      - name: Built preview HTTP boundary
        timeout-minutes: 2
        run: |
          setsid pnpm exec wrangler dev --config preview/wrangler.json --ip 127.0.0.1 --port 5182 --local > /tmp/playground-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill -- "-$preview_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5182/version.json > /dev/null; then break; fi
            sleep 1
          done
          node preview/smoke.mjs http://127.0.0.1:5182

  database-security:
    name: database-security
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: ci-database-security-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    env:
      WRANGLER_SEND_METRICS: "false"
      SUPABASE_EXPERIMENTAL_STACK: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        timeout-minutes: 5
      - name: Verify pinned tools and local Docker boundary
        run: |
          test "$(pnpm --version)" = "12.11.2"
          node tests/database/ci.mjs check
        timeout-minutes: 2
      - name: Start bounded local Supabase
        run: node tests/database/ci.mjs start
        timeout-minutes: 11
      - name: Reconstruct migrations from scratch
        run: node tests/database/ci.mjs reset
        timeout-minutes: 4
      - name: Database and real-connection integrity tests
        run: pnpm test:db
        timeout-minutes: 5
      - name: Genuine Auth and PostgREST security tests
        run: pnpm test:security
        timeout-minutes: 10
      - name: Local authenticated UI persistence and restart proof
        timeout-minutes: 4
        run: |
          start_local() {
            setsid pnpm dev:local-tenant > /tmp/local-tenant.log 2>&1 &
            local_pid=$!
            for attempt in $(seq 1 40); do
              if curl --fail --silent http://127.0.0.1:5192/development/business > /dev/null; then return; fi
              sleep 1
            done
            exit 1
          }
          trap 'kill -- "-$local_pid" 2>/dev/null || true' EXIT
          start_local
          node local/smoke.mjs
          kill -- "-$local_pid" 2>/dev/null || true
          wait "$local_pid" 2>/dev/null || true
          sleep 2
          start_local
          node local/smoke.mjs --resume
          kill -- "-$local_pid" 2>/dev/null || true
          wait "$local_pid" 2>/dev/null || true
          node tests/database/ci.mjs reset
      - name: Verify canonical restoration and fixture hygiene
        run: node tests/database/ci.mjs hygiene
        timeout-minutes: 2
      - name: Local database advisors
        run: node tests/database/ci.mjs advisors
        timeout-minutes: 3
      - name: Stop and remove only this local project
        if: ${{ always() }}
        run: node tests/database/ci.mjs stop
        timeout-minutes: 2

  shared-onboarding:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SUPABASE_EXPERIMENTAL_STACK: "0"
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check out the primary project's reviewed Reserve baseline
        uses: actions/checkout@v4
        with:
          repository: venipublishing-main/venipublishing-website
          ref: aac1382f41dfb1e7bb8bf11d5ee1f74a6700d274
          path: .tmp/website
          persist-credentials: false
      - name: Check out the shared Arcana baseline
        uses: actions/checkout@v4
        with:
          repository: venipublishing-main/venipublishing-website-preview
          ref: ae1c4929ce8d8aaa954eacfe9b4494bfb2924301
          path: .tmp/website-preview
          persist-credentials: false
      - name: Replay primary schema and onboarding candidate in an isolated local stack
        run: |
          set -euo pipefail
          stack="$RUNNER_TEMP/reserve-onboarding"
          mkdir -p "$stack/supabase/migrations"
          cp tests/shared-stack/supabase/config.toml "$stack/supabase/"
          # Website's historical bootstrap predates the ledger. Load it first in the test fixture.
          cp .tmp/website/supabase/migrations/20260903_001_veni_account_foundation.sql "$stack/supabase/migrations/20260903070000_fixture_account_foundation.sql"
          cp .tmp/website/supabase/migrations/20260903071048_revoke_handle_new_user_rpc_access.sql "$stack/supabase/migrations/"
          cp .tmp/website-preview/supabase/migrations/20260903072229_arcana_stage3_pilot_foundation.sql "$stack/supabase/migrations/"
          baseline=(.tmp/website/supabase/migrations/20261117*_reserve_shared_*.sql)
          test "${#baseline[@]}" -eq 9
          cp "${baseline[@]}" integration/veni-publishing/supabase/migrations/*.sql "$stack/supabase/migrations/"
          pnpm exec supabase start --workdir "$stack" -x realtime,storage-api,imgproxy,studio,postgres-meta,mailpit,edge-runtime,logflare,vector,supavisor > /dev/null
          node local/shared-workspace-smoke.mjs "$stack"
          pnpm exec supabase db advisors --local --workdir "$stack" --type security --level warn --fail-on error
      - if: always()
        run: pnpm exec supabase stop --workdir "$RUNNER_TEMP/reserve-onboarding" --no-backup
