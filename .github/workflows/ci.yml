name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - name: Built standalone route boundary
        timeout-minutes: 2
        run: |
          setsid pnpm exec vite preview --host 127.0.0.1 --port 5185 --strictPort > /tmp/reserve-site.log 2>&1 &
          site_pid=$!
          trap 'kill -- "-$site_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5185/health > /dev/null; then break; fi
            sleep 1
          done
          node scripts/site-smoke.mjs http://127.0.0.1:5185
      - run: pnpm build:playground-preview
      - name: Built preview HTTP boundary
        timeout-minutes: 2
        run: |
          setsid pnpm exec wrangler dev --config preview/wrangler.json --ip 127.0.0.1 --port 5182 --local > /tmp/playground-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill -- "-$preview_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5182/version.json > /dev/null; then break; fi
            sleep 1
          done
          node preview/smoke.mjs http://127.0.0.1:5182

  database-security:
    name: database-security
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: ci-database-security-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    env:
      WRANGLER_SEND_METRICS: "false"
      SUPABASE_EXPERIMENTAL_STACK: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        timeout-minutes: 5
      - name: Verify pinned tools and local Docker boundary
        run: |
          test "$(pnpm --version)" = "12.11.2"
          node tests/database/ci.mjs check
        timeout-minutes: 2
      - name: Start bounded local Supabase
        run: node tests/database/ci.mjs start
        timeout-minutes: 11
      - name: Reconstruct migrations from scratch
        run: node tests/database/ci.mjs reset
        timeout-minutes: 4
      - name: Database and real-connection integrity tests
        run: pnpm test:db
        timeout-minutes: 5
      - name: Genuine Auth and PostgREST security tests
        run: pnpm test:security
        timeout-minutes: 10
      - name: Verify canonical restoration and fixture hygiene
        run: node tests/database/ci.mjs hygiene
        timeout-minutes: 2
      - name: Local database advisors
        run: node tests/database/ci.mjs advisors
        timeout-minutes: 3
      - name: Stop and remove only this local project
        if: ${{ always() }}
        run: node tests/database/ci.mjs stop
        timeout-minutes: 2
